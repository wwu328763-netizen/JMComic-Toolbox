name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install jmcomic pywebview pillow pyinstaller psutil

      - name: Build exe
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File webui\build_web.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: JMComicWeb-windows
          path: |
            JMComicWeb.exe
            webui/
            option.example.yml
          if-no-files-found: error
