<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>迁移模板示例</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-theme="dark">
  <header class="topbar">
    <b class="brand">迁移模板</b>
    <input id="q" placeholder="输入内容，回车新增">
    <button id="addBtn" class="btn primary">新增</button>
    <button id="runBtn" class="btn ghost">运行任务</button>
    <button id="themeBtn" class="btn ghost">主题</button>
  </header>

  <main class="content">
    <div id="list" class="list"></div>
    <div id="empty" class="empty">列表是空的 —— 在上面输入内容回车</div>
  </main>

  <footer class="statusbar">
    <div class="progress"><i id="bar"></i></div>
    <div class="row">
      <span id="status">就绪</span>
      <button id="logBtn" class="link">日志 ▾</button>
    </div>
    <div id="logPanel" class="log-panel"><div id="logList" class="log-list"></div></div>
  </footer>

  <div id="toasts" class="toasts"></div>
  <script src="app.js"></script>
</body>
</html>
